name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: ['5.1', '5.2']
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@v4
        with:
          path: addon
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: AlexAllocated/libchev
          ref: cd928e315836cf78e9a8b3972d26b048b6490d38
          path: library
      - run: sudo apt-get update && sudo apt-get install -y lua${{ matrix.lua }}
      - run: python3 scripts/check_release_notes.py --check --release-history
      - run: python3 scripts/localization.py
      - run: python3 scripts/test_localization.py
      - run: python3 scripts/test_release_notes.py
      - run: python3 scripts/test_generate_release_notes.py
      - run: python3 scripts/test_discord_changelog.py
      - run: lua${{ matrix.lua }} scripts/test.lua
      - run: lua${{ matrix.lua }} scripts/test.lua . reverse
      - run: |
          for locale in deDE frFR esES esMX ptBR ruRU; do
            QT_TEST_LOCALE="$locale" lua${{ matrix.lua }} scripts/test.lua
          done
      - run: |
          for client in retail forever era tbc mists titan; do
            lua${{ matrix.lua }} scripts/test.lua . normal "$client"
          done
      - run: |
          for client in retail forever; do
            lua${{ matrix.lua }} scripts/location_client_profiles.lua . "$client"
          done
      - run: python3 ../library/scripts/vendor.py . --check
      - run: |
          while IFS= read -r -d '' file; do
            luac${{ matrix.lua }} -p "$file" || exit "$?"
          done < <(find . -name '*.lua' -print0)
      - run: bash -n scripts/bump_version.sh && git diff --check
