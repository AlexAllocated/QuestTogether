name: Prepare release notes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline authoring contracts
        run: python3 scripts/test_prepare_release_notes.py
      - name: Export source evidence for authoring in an active Codex session
        run: python3 scripts/prepare_release_notes.py context --output .local/release-note-context.json
      - name: Upload authoring context
        uses: actions/upload-artifact@v4
        with:
          name: release-note-context-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: .local/release-note-context.json
