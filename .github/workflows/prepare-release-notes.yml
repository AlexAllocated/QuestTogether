name: Prepare release notes

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model used to draft the notes
        required: true
        default: gpt-5.5
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check offline generation contracts
        run: |
          python3 scripts/test_release_notes.py
          python3 scripts/test_generate_release_notes.py
      - name: Generate shared notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHANGELOG_OPENAI_MODEL: ${{ inputs.model }}
        run: |
          mkdir -p .local
          python3 scripts/generate_release_notes.py --write --markdown-out .local/generated-release-notes.md
      - name: Verify generated files before publishing the preparation branch
        id: notes
        run: |
          version="$(python3 -c 'import json; print(json.load(open("release_notes.json"))["version"])')"
          python3 scripts/check_release_notes.py --check --baseline-ref "refs/tags/v${version}"
          git diff --exit-code -- QuestTogether.toc
          git diff --check
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Commit notes to a unique preparation branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -- release_notes.json ReleaseNotes.lua
          if git diff --cached --quiet; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            printf 'The generated notes already match the current files.\n'
            exit 0
          fi
          branch="automation/release-notes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare generated release notes for review'
          git push --set-upstream origin "$branch"
          printf 'changed=true\nbranch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
      - name: Open a review pull request
        if: steps.branch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_BRANCH: ${{ steps.branch.outputs.branch }}
          NOTES_VERSION: ${{ steps.notes.outputs.version }}
        run: |
          cat > .local/release-notes-pr-body.md <<'BODY'
          This generated draft updates the shared in-game and Discord release notes from changes since the current release tag. Human review is required before merging or publishing.

          Verify that the notes describe only new player-facing changes, use accurate defaults and limits, and match the intended release. JSON and Lua consistency and the release baseline were checked before this branch was pushed. This preparation does not bump the version or publish a release.

          BODY
          cat .local/generated-release-notes.md >> .local/release-notes-pr-body.md
          printf '\nGenerated by workflow run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> .local/release-notes-pr-body.md
          gh pr create --base main --head "$NOTES_BRANCH" --title "Prepare next release notes after ${NOTES_VERSION}" --body-file .local/release-notes-pr-body.md
      - name: Preserve generated notes even if PR creation is blocked
        if: ${{ always() && hashFiles('.local/generated-release-notes.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            release_notes.json
            ReleaseNotes.lua
            .local/generated-release-notes.md
